{% extends "base.html" %}
{% block title %}注册 - STAONS{% endblock %}
{% block content %}
<div class="form-card">
  <h2>注册账户</h2>
  <form method="post" action="{{ url_for('register') }}">
    <div class="form-group">
      <label>用户名(3-20位,字母/数字/下划线)</label>
      <input type="text" name="username" value="{{ username }}" required>
    </div>
    <div class="form-group">
      <label>密码(至少8位)</label>
      <input type="password" name="password" required>
    </div>
    <div class="form-group">
      <label>确认密码</label>
      <input type="password" name="confirm_password" required>
    </div>
    <div class="form-group">
      <label>人机验证码</label>
      <div class="captcha-row">
        <input type="text" name="captcha" placeholder="输入右侧验证码" required style="flex:1">
        <img id="captchaImg" src="{{ url_for('captcha_image') }}" alt="验证码" title="点击刷新" onclick="this.src='{{ url_for('captcha_image') }}?t='+Date.now()">
      </div>
    </div>
    <button class="btn btn-primary form-submit" type="submit">注册</button>
  </form>
  <div class="form-footer">
    已有账户?<a href="{{ url_for('login') }}">去登录</a> &nbsp;|&nbsp; <a href="{{ url_for('index') }}">返回首页</a>
  </div>
</div>
{% endblock %}
